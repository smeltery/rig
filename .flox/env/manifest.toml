schema-version = "1.16.0"

[install]
go.pkg-path = "go"
bun.pkg-path = "bun"
just.pkg-path = "just"
git.pkg-path = "git"
git.outputs = "all"
pre-commit.pkg-path = "pre-commit"
pre-commit.outputs = "all"
golangci-lint.pkg-path = "golangci-lint"
actionlint.pkg-path = "actionlint"
shellcheck.pkg-path = "shellcheck"
shellcheck.outputs = "all"

[hook]
on-activate = '''
  echo "rig: just setup installs locked docs tools and Git hooks; just check runs CI checks."
'''

[options]
systems = ["x86_64-linux", "aarch64-linux", "x86_64-darwin", "aarch64-darwin"]
