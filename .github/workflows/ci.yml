name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, docs, and website
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4 # v2.7.0
        with:
          version: 1.17.0
      - name: Install locked tooling
        run: |
          flox activate -- bun install --frozen-lockfile
          flox activate -- bun run --bun puppeteer browsers install chrome
      - name: Run shared quality checks
        run: flox activate -- ./scripts/check.sh quality
      - name: Upload website preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website
          path: dist/
          retention-days: 7
  test:
    name: Build and race tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flox/install-flox-action@5bb9eaaffbeaa699a8251a1ae21ecf4c8e0e37d4 # v2.7.0
        with:
          version: 1.17.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', '.flox/env/manifest.lock') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: Run shared build and test checks
        run: flox activate -- ./scripts/check.sh test
