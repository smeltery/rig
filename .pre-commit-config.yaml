default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: quality
        name: CI quality checks (Flox)
        entry: flox activate -- ./scripts/check.sh quality
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: test
        name: CI build and race tests (Flox)
        entry: flox activate -- ./scripts/check.sh test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
